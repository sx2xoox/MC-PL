# ─────────────────────────────────────────────────────────────
#  봇 채팅 문구 (증강 봇전 · 봇 관전전): 봇이 플레이어처럼 채팅합니다  <철수 봇> 거기 숨은 거 다 보여
#  상황(키)마다 general = 모든 봇, hunter/fortress/... = 그 성격의 봇만 (성격 줄이 있으면 약 60% 확률로 먼저 고름).
#  성격 키: hunter 사냥꾼 · fortress 요새꾼 · archer 저격수 · opportunist 어부지리형 · berserker 광전사 · survivor 생존왕
#           trapper 트래퍼 · assassin 암살자 · tank 탱커 · avenger 복수귀 · gambler 도박사 · nomad 유목민
#  자리 표시자: <target> 상대 이름 · <augment> 받은 증강 · <gear> 장비 등급(철, 다이아) · <kills> 내 킬 수
#              <alive> 남은 인원 · <me> 봇 자신의 이름. 필요한 값이 없는 상황이면 그 줄은 건너뜁니다.
#  MiniMessage 형식(색 태그 가능). 켜기·빈도: config.yml games.augment.bots.chat.* . 경기마다 새로 읽습니다.
#  이 파일에 없는 상황(키)은 플러그인에 내장된 기본 문구를 씁니다.
# ─────────────────────────────────────────────────────────────

