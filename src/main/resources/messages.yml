# ─────────────────────────────────────────────────────────────
#  MCPL 메시지 (MiniMessage 형식: https://docs.advntr.dev/minimessage/format)
#  <prefix> 는 아래 prefix 로 바뀝니다. <player>, <game> 같은 꺾쇠 이름은 자동으로 채워집니다.
#  이 파일에 없는 키는 플러그인에 내장된 기본 문구를 사용합니다. 수정 후 /게임 리로드
# ─────────────────────────────────────────────────────────────

prefix: "<gradient:#ffb347:#ff5e62><bold>MCPL</bold></gradient> <dark_gray>»</dark_gray> "

# ── 오류 ─────────────────────────────────────────────────────
error:
  internal: "<red>내부 오류가 발생했습니다. 콘솔 로그를 확인해 주세요."
  already-running: "<red>이미 <game><red> 경기가 진행 중입니다. <gray>먼저 <white>/게임 중지</white> 해 주세요."
  not-enough-players: "<red>인원이 부족합니다. <gray>(참가 가능 <white><count></white>명 / 최소 <white><min></white>명)"
  arena-world-missing: "<red>경기장 월드 <white><world></white>을(를) 찾을 수 없습니다. <gray><white>/게임 경기장 초기화</white> 또는 다시 설정해 주세요."
  no-games: "<red>등록된 미니게임이 없습니다."
  choose-game: "<red>시작할 게임을 지정해 주세요. <gray>예) <white>/게임 시작 초능력전쟁</white> · 목록은 <white>/게임 목록</white>"
  unknown-game: "<red>'<white><input></white>'(이)라는 게임을 찾을 수 없습니다. <gray><white>/게임 목록</white>으로 확인해 주세요."
  nothing-to-stop: "<gray>진행 중인 경기나 대기 중인 순환이 없습니다."
  player-only: "<red>플레이어만 사용할 수 있는 명령어입니다."
  rotation-empty: "<red>순환 목록(config.yml 의 rotation.games)에 등록된 게임이 없습니다."
  reload-failed: "<red>설정을 다시 불러오지 못했습니다. 콘솔 로그를 확인해 주세요."
  config-broken: "<red>config.yml 에 문법 오류가 있어 설정을 저장할 수 없습니다. <gray>파일을 고친 뒤 <white>/게임 리로드</white> 해 주세요. (콘솔 로그 참고)"

# ── 도움말 (/게임) ───────────────────────────────────────────
help:
  header: "<gradient:#ffb347:#ff5e62><bold>MCPL</bold></gradient> <gray>고전 미니게임 허브 <dark_gray>· <gray>명령어를 클릭하면 입력됩니다"
  play:
    - " <click:suggest_command:'/게임 목록'><hover:show_text:'<gray>클릭하여 입력'><#ffb347>/게임 목록</#ffb347></hover></click> <dark_gray>-</dark_gray> <gray>미니게임 목록"
    - " <click:suggest_command:'/게임 참가'><hover:show_text:'<gray>클릭하여 입력'><#ffb347>/게임 참가</#ffb347></hover></click> <dark_gray>/</dark_gray> <click:suggest_command:'/게임 관전'><hover:show_text:'<gray>클릭하여 입력'><#ffb347>관전</#ffb347></hover></click> <dark_gray>-</dark_gray> <gray>다음 경기 참가 / 관전 선택"
  admin:
    - " <click:suggest_command:'/게임 시작 '><hover:show_text:'<gray>클릭하여 입력'><#ff7f50>/게임 시작 [모드]</#ff7f50></hover></click> <dark_gray>-</dark_gray> <gray>경기 시작 (생략 시 순환 목록의 다음 게임)"
    - " <click:suggest_command:'/게임 중지'><hover:show_text:'<gray>클릭하여 입력'><#ff7f50>/게임 중지</#ff7f50></hover></click> <dark_gray>-</dark_gray> <gray>경기 강제 종료 및 복구"
    - " <click:suggest_command:'/게임 순환 '><hover:show_text:'<gray>클릭하여 입력'><#ff7f50>/게임 순환 \\<켜기|끄기|목록></#ff7f50></hover></click> <dark_gray>-</dark_gray> <gray>자동 연속 진행"
    - " <click:suggest_command:'/게임 경기장 설정 '><hover:show_text:'<gray>클릭하여 입력'><#ff7f50>/게임 경기장 설정 [반경]</#ff7f50></hover></click> <dark_gray>/</dark_gray> <click:suggest_command:'/게임 경기장 초기화'><hover:show_text:'<gray>클릭하여 입력'><#ff7f50>초기화</#ff7f50></hover></click> <dark_gray>-</dark_gray> <gray>경기장 중심"
    - " <click:suggest_command:'/게임 설정 팀 '><hover:show_text:'<gray>클릭하여 입력'><#ff7f50>/게임 설정 팀 \\<인원></#ff7f50></hover></click> <dark_gray>-</dark_gray> <gray>팀당 인원 (0 = 개인전)"
    - " <click:suggest_command:'/게임 리로드'><hover:show_text:'<gray>클릭하여 입력'><#ff7f50>/게임 리로드</#ff7f50></hover></click> <dark_gray>-</dark_gray> <gray>설정 다시 불러오기"
  footer: "<dark_gray>영어 명령어도 사용할 수 있습니다: /mcpl start, stop, list, join, spectate, rotation, arena, settings, reload"

# ── 목록 (/게임 목록) ────────────────────────────────────────
list:
  header: "<gradient:#ffb347:#ff5e62><bold>미니게임</bold></gradient> <gray><count>종"
  entry: " <dark_gray>▪</dark_gray> <game> <dark_gray>(<id>)</dark_gray> <gray>최소 <white><min></white>명 · <mode></gray><status>"
  description: "    <gray><line>"
  teams-yes: "개인전/팀전"
  teams-no: "개인전"
  status-running: " <green>● 진행 중</green>"
  status-next: " <yellow>▶ 다음 순서</yellow>"

# ── 명령어 응답 ──────────────────────────────────────────────
command:
  stopped: "<yellow>경기를 중지했습니다. 모두 경기 전 상태로 복구됩니다."
  rotation-cancelled: "<yellow>대기 중이던 다음 경기를 취소했습니다. <gray>(순환 모드는 켜져 있으며, 다음 경기가 끝나면 다시 이어집니다)"
  join: "<green>다음 경기부터 <bold>참가</bold>합니다."
  join-now: "<green>경기에 합류했습니다!"
  join-already: "<gray>이미 경기에 참가 중입니다."
  join-next-match: "<green>다음 경기부터 참가합니다. <gray>(지금은 관전 중)"
  spectate: "<yellow>다음 경기부터 <bold>관전</bold>합니다. <gray>참가하려면 <white>/게임 참가</white>"
  spectate-next-match: "<yellow>다음 경기부터 관전합니다. <gray>(이번 경기는 끝까지 진행됩니다)"
  rotation-status-on: "<gray>순환 모드: <green><bold>켜짐</bold></green> <dark_gray>·</dark_gray> 다음 게임 <next> <dark_gray>·</dark_gray> 대기 <white><seconds></white>초"
  rotation-status-off: "<gray>순환 모드: <red><bold>꺼짐</bold></red> <dark_gray>·</dark_gray> 다음 순서 <next>"
  rotation-none: "<dark_gray>없음"
  rotation-waiting: "<gray>다음 경기까지 <yellow><seconds></yellow>초"
  rotation-on: "<green>순환 모드를 켰습니다. <gray>경기가 끝나면 <white><seconds></white>초 뒤 다음 게임이 자동으로 시작됩니다."
  rotation-off: "<yellow>순환 모드를 껐습니다."
  rotation-list: "<gray>순환 순서: <list>"
  rotation-list-empty: "<gray>순환 목록이 비어 있습니다. <dark_gray>(config.yml → rotation.games)"
  arena-none: "<gray>저장된 경기장이 없습니다. 경기를 시작한 사람의 위치가 중심이 됩니다. <dark_gray>(반경 <radius>)"
  arena-info: "<gray>경기장: <white><world></white> <dark_gray>(<x>, <y>, <z>)</dark_gray> 반경 <white><radius></white>"
  arena-set: "<green>경기장을 저장했습니다: <white><world></white> <dark_gray>(<x>, <y>, <z>)</dark_gray> <green>반경 <white><radius></white>"
  arena-reset: "<yellow>경기장 설정을 지웠습니다. <gray>이제 경기를 시작한 사람의 위치가 중심이 됩니다. (반경 <radius>)"
  applies-next-match: "<gray>진행 중인 경기에는 적용되지 않고 다음 경기부터 적용됩니다."
  team-ffa: "<green>개인전으로 설정했습니다."
  team-size: "<green>팀당 <white><size></white>명 팀전으로 설정했습니다."
  settings: |-
    <gradient:#ffb347:#ff5e62><bold>현재 설정</bold></gradient>
     <gray>대전 방식</gray> <white><teams>
     <gray>카운트다운</gray> <white><countdown>초</white> <dark_gray>·</dark_gray> <gray>결과 표시</gray> <white><ending>초
     <gray>순환 모드</gray> <rotation> <dark_gray>·</dark_gray> <gray>대기</gray> <white><intermission>초
     <gray>경기장 반경</gray> <white><radius>
     <gray>월드 보호</gray> <white><protection> 항목 켜짐 <dark_gray>(config.yml → protection)
  settings-ffa: "개인전"
  settings-team: "팀전 (팀당 <size>명)"
  "on": "<green>켜짐"
  "off": "<red>꺼짐"
  reloaded: "<green>설정을 다시 불러왔습니다. <dark_gray>(<ms>ms)"

