# ── 설정 (/게임 설정) ────────────────────────────────────────
settings:
  "on": "<green>켜짐"
  "off": "<red>꺼짐"
  # 숫자 표시 (<value> = 숫자, <duration> = 1분 이상일 때 "2분 30초")
  unit:
    seconds: "<white><value>초"
    minutes: "<white><duration></white> <dark_gray>(<value>초)"
    blocks: "<white><value>블록"
    players: "<white><value>명"
    count: "<white><value>개"
    times: "<white><value>회"
    multiplier: "<white>×<value>"
    percent: "<white><value>%"
  # 명령어로 바꿨을 때 (채팅)
  changed: "<gray><name></gray> <dark_gray>→</dark_gray> <value> <dark_gray>(config.yml 에 저장됨)"
  unchanged: "<gray><name></gray> <dark_gray>:</dark_gray> <value> <dark_gray>(이미 이 값입니다)"
  # 디스크가 가득 찼거나 폴더에 쓸 수 없을 때 (콘솔 로그에 원인)
  save-failed: "<red><name> → <value> 로 바꿨지만 config.yml 에 저장하지 못했습니다. <gray>서버를 다시 켜면 사라집니다. (콘솔 로그 참고)"
  clamped: "<gray>입력한 값이 범위를 벗어나 가장 가까운 값으로 맞췄습니다. <dark_gray>범위: <min> ~ <max>"
  # 곧 시작할 경기(카운트다운 중)에도 적용되는 변경
  applies-this-match: "<gray>카운트다운 중인 경기에도 적용됩니다."
  current: "<gray><name></gray> <dark_gray>:</dark_gray> <value> <dark_gray>· 바꾸려면 <white><usage>"
  no-permission: "<red>설정을 바꿀 권한이 없습니다."
  # /게임 설정 목록 (콘솔에서 /게임 설정 도 같은 목록)
  list:
    header: "<gradient:#ffb347:#ff5e62><bold>현재 설정</bold></gradient> <dark_gray>· 줄을 클릭하면 명령어가 입력됩니다 · 메뉴: /게임 설정"
    section: " <section>"
    entry: "   <dark_gray>▪</dark_gray> <gray><name></gray> <value>"
    hover: "<gray>클릭하면 입력됩니다: <white><usage>"
    footer: "   <dark_gray>그 밖에 (config.yml): 결과 표시 <gray><ending>초</gray> · 순환 모드 <rotation><dark_gray> · 순환 대기 <gray><intermission>초</gray> · 경기장 반경 <gray><radius></gray> · 월드 보호 <gray><protection></gray> 항목"
  # 설정 메뉴 (상자 화면)
  menu:
    title: "<dark_gray>MCPL 설정"
    entry-name: "<yellow><name></yellow> <dark_gray>·</dark_gray> <value>"
    value: "<gray>현재 값: <value>"
    value-max: "<gray>현재 값: <value> <red>(최댓값)"
    value-min: "<gray>현재 값: <value> <red>(최솟값)"
    default: "<dark_gray>기본값: <default>"
    # <zero> = 0 의 뜻이 있을 때 zero-means, 없으면 빈칸
    range: "<dark_gray>범위 <min> ~ <max><zero> · 기본값 <default>"
    zero-means: "<dark_gray> (0 = <zero><dark_gray>)"
    # 경기 중이라 이 항목을 바꾸면 다음 경기부터 적용될 때
    waits: "<gold>⏳ 진행 중인 경기에는 적용되지 않고 다음 경기부터 적용됩니다"
    options: "<dark_gray>선택지: <options>"
    option: "<dark_gray><option>"
    option-current: "<white><bold>▶</bold> <option>"
    option-separator: "<dark_gray> / "
    hint-toggle: "<yellow>클릭</yellow> <gray>켜기 / 끄기"
    hint-number: "<yellow>좌클릭</yellow> <gray>+<step></gray> <dark_gray>·</dark_gray> <yellow>우클릭</yellow> <gray>-<step></gray> <dark_gray>·</dark_gray> <yellow>Shift+클릭</yellow> <gray>±<big>"
    hint-choice: "<yellow>좌클릭</yellow> <gray>다음</gray> <dark_gray>·</dark_gray> <yellow>우클릭</yellow> <gray>이전"
    hint-reset: "<yellow>Q</yellow> <gray>(버리기 키) 기본값으로"
    command: "<dark_gray>명령어: <command>"
    path: "<dark_gray>config.yml → <path>"
    # 액션바
    changed: "<gray><name></gray> <dark_gray>→</dark_gray> <value>"
    changed-next-match: "<gray><name></gray> <dark_gray>→</dark_gray> <value> <dark_gray>· 다음 경기부터 적용"
    unchanged: "<gray><name></gray> <dark_gray>:</dark_gray> <value>"
    at-max: "<gray><name></gray> <dark_gray>:</dark_gray> <value> <red>(최댓값)"
    at-min: "<gray><name></gray> <dark_gray>:</dark_gray> <value> <red>(최솟값)"
    help:
      name: "<gold>설정 메뉴 사용법"
      lore:
        - "<gray>항목을 클릭하면 값이 바뀌고 <white>config.yml</white> 에 바로 저장됩니다."
