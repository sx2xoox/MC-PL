  left-countdown: "<red>-</red> <white><player></white><gray>님이 빠졌습니다. <dark_gray>(<count>명)"
  joined-spectator: "<gray>진행 중인 <game><gray> 경기를 관전합니다. 경기가 끝나면 원래 상태로 돌아갑니다."
  late-join: "<green>+</green> <player><gray>님이 경기에 합류했습니다."
