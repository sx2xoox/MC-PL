# ─────────────────────────────────────────────────────────────
#  MCPL 메시지 (MiniMessage 형식: https://docs.advntr.dev/minimessage/format)
#  <prefix> 는 아래 prefix 로 바뀝니다. <player>, <game> 같은 꺾쇠 이름은 자동으로 채워집니다.
#  이 파일에 없는 키는 플러그인에 내장된 기본 문구를 사용합니다. 수정 후 /게임 리로드
# ─────────────────────────────────────────────────────────────

prefix: "<gradient:#ffb347:#ff5e62><bold>MCPL</bold></gradient> <dark_gray>»</dark_gray> "

# ── 오류 ─────────────────────────────────────────────────────
error:
  internal: "<red>내부 오류가 발생했습니다. 콘솔 로그를 확인해 주세요."
  already-running: "<red>이미 <game><red> 경기가 진행 중입니다. <gray>먼저 <white>/게임 중지</white> 해 주세요."
  not-enough-players: "<red>인원이 부족합니다. <gray>(참가 가능 <white><count></white>명 / 최소 <white><min></white>명)"
  map-unknown: "<red>맵 <white><id></white>을(를) 찾을 수 없습니다. <gray><white>/게임 맵</white>으로 목록을 확인하세요."
  map-busy: "<red>다른 맵을 짓는 중입니다. 끝난 뒤 다시 시도해 주세요."
  map-match-running: "<red>경기 중에는 맵을 지을 수 없습니다. 경기가 끝난 뒤 다시 시도해 주세요."
  map-not-built: "<red>맵 <white><name></white>을(를) 아직 짓지 않았습니다. <gray><white>/게임 맵 <id></white>로 먼저 지어 주세요."
  arena-world-missing: "<red>경기장 월드 <white><world></white>을(를) 찾을 수 없습니다. <gray><white>/게임 맵 해제</white> 또는 다시 설정해 주세요."
  no-games: "<red>등록된 미니게임이 없습니다."
  admin-only: "<red>관리자만 경기를 시작할 수 있습니다."
  choose-game: "<red>시작할 게임을 지정해 주세요. <gray>예) <white>/게임 시작 초능력전쟁</white> · 목록은 <white>/게임 목록</white>"
  unknown-game: "<red>'<white><input></white>'(이)라는 게임을 찾을 수 없습니다. <gray><white>/게임 목록</white>으로 확인해 주세요."
  nothing-to-stop: "<gray>진행 중인 경기나 대기 중인 순환이 없습니다."
  player-only: "<red>플레이어만 사용할 수 있는 명령어입니다."
  rotation-empty: "<red>순환 목록(config.yml 의 rotation.games)에 등록된 게임이 없습니다."
  reload-failed: "<red>설정을 다시 불러오지 못했습니다. 콘솔 로그를 확인해 주세요."
  config-broken: "<red>config.yml 에 문법 오류가 있어 설정을 저장할 수 없습니다. <gray>파일을 고친 뒤 <white>/게임 리로드</white> 해 주세요. (콘솔 로그 참고)"
  config-changed: "<red>config.yml 이 수정된 뒤 아직 불러오지 않아 설정을 바꾸지 않았습니다. <gray>바꾸면 그 수정 내용을 덮어쓰게 됩니다. <white>/게임 리로드</white> 로 먼저 불러온 뒤 다시 해 주세요."

# ── 리소스팩 (config.yml 의 resource-pack) ─────────────────────
resource-pack:
  prompt: "<gradient:#ffb347:#ff5e62><bold>MCPL</bold></gradient> <white>공성전 타워 같은 3D 모델용 리소스팩입니다.</white>\n<gray>받지 않아도 플레이할 수 있습니다 (바닐라 블록 모습으로 대신 표시)."
  status:
    loaded: "<green>적용됨"
    pending: "<yellow>받는 중"
    declined: "<red>거절"
    failed: "<red>실패"
    none: "<gray>안 보냄"
  mode:
    off: "<gray>꺼짐 <dark_gray>(config.yml 의 resource-pack.enabled)"
    same-port: "<white>접속 포트로 함께"
    separate-port: "<white>별도 포트 <port>"
    url: "<white>직접 올린 주소"
  self: "<gray>내 리소스팩: <status> <dark_gray>· <gray>받는 주소 <white><url></white>"
  self-off: "<gray>이 서버는 리소스팩을 보내지 않습니다 <dark_gray>(resource-pack.enabled: false)"
  check-hint: "<gray>눈앞에 <white>10초</white> 동안 확인용 상자가 나타납니다: <green>초록 OK 상자</green>가 보이면 정상, <light_purple>보라·검정 체크무늬</light_purple>나 아무것도 안 보이면 리소스팩이 적용되지 않은 것입니다. <click:run_command:'/게임 리소스팩 다시받기'><hover:show_text:'<gray>클릭하여 다시 받기'><#ffb347>[다시 받기]</#ffb347></hover></click>"
  check-label: "<white>리소스팩 확인</white>\n<green>초록 OK 상자</green><gray>가 보이면 정상</gray>\n<light_purple>보라·검정 체크무늬</light_purple><gray>나 빈 곳이면</gray>\n<red>리소스팩이 적용되지 않음</red>"
  list-header: "<gray>리소스팩 <dark_gray>· <gray>방식 <mode> <dark_gray>· <gray>적용 <white><loaded></white>/<white><total></white>명"
  list-entry: " <dark_gray>-</dark_gray> <white><player></white> <status> <dark_gray><url></dark_gray>"
  list-empty: " <gray>접속한 플레이어가 없습니다."
  resent-self: "<gray>리소스팩을 다시 보냈습니다. 받기를 누른 뒤 <white>/게임 리소스팩</white> 으로 확인하세요."
  resent: "<gray>리소스팩을 다시 보냈습니다: <white><count></white>명"
  resend-off: "<red>리소스팩 보내기가 꺼져 있습니다. <gray>(config.yml 의 resource-pack.enabled)"
  unknown-player: "<red>'<white><input></white>' 플레이어를 찾을 수 없습니다."
  missing-before-start: "<yellow>리소스팩이 적용되지 않은 참가자 <white><count></white>명: <white><players></white> <gray>(바닐라 블록 모습으로 보입니다) <click:run_command:'/게임 리소스팩'><hover:show_text:'<gray>클릭하여 상태 보기'><#ffb347>[/게임 리소스팩]</#ffb347></hover></click>"

# ── 도움말 (/게임, /게임 도움말) ─────────────────────────────
# 분류(sections)마다 play(모두) 줄과 admin(관리자) 줄이 있습니다. 관리자가 아니면 admin 줄은 보이지 않고,
# 보여 줄 줄이 없는 분류는 제목도 나오지 않습니다.
# <cmd:'/게임 …'> 는 클릭하면 입력되는 명령어, <cmd:'입력될 명령어':'보이는 글'> 처럼 보이는 글을 따로 줄 수 있습니다.
help:
  header: "<gradient:#ffb347:#ff5e62><bold>MCPL</bold></gradient> <gray>고전 미니게임 허브 <dark_gray>· <gray>명령어를 클릭하면 입력됩니다"
  click-hint: "<gray>클릭하여 입력"
  footer: "<dark_gray>영어 이름도 됩니다: /mcpl start superpower, /mcpl reroll, /mcpl practice dummies, /mcpl map …"
  sections:
    start:
      title: "<#ffb347><bold>▸ 시작</bold>"
      play: []
      admin:
        - " <cmd:'/게임 시작 초능력전쟁'> <dark_gray>-</dark_gray> <gray>초능력전쟁 (접속 중인 모두 참가, 관전은 미리 /게임 관전)"
        - " <cmd:'/게임 시작 증강'> <dark_gray>-</dark_gray> <gray>증강 야생전: 새 야생 월드에서 파밍 → PvP"
        - " <cmd:'/게임 시작 증강 봇전 ':'/게임 시작 증강 봇전 [수] [난이도]'> <dark_gray>-</dark_gray> <gray>봇이 빈자리를 채우는 증강 야생전 (섞기: 쉬움 3 어려움 2 · 팀전: <cmd:'/게임 시작 증강 봇전 팀 ':'봇전 팀 3 4 보통'><gray>)"
        - " <cmd:'/게임 시작 증강 관전 ':'/게임 시작 증강 관전 [수] [난이도]'> <dark_gray>-</dark_gray> <gray>봇끼리만 싸우고 모두 관전 (팀전: <cmd:'/게임 시작 증강 관전 팀 ':'관전 팀 3 2 보통'><gray>)"
        - " <cmd:'/게임 시작 공성전'> <dark_gray>-</dark_gray> <gray>초능력 공성전: 두 팀이 탑 셋을 공격·수비"
        - " <cmd:'/게임 시작 공성전 봇전 ':'/게임 시작 공성전 봇전 [팀당 인원] [난이도]'> <dark_gray>-</dark_gray> <gray>봇이 빈자리를 채우는 공성전 (봇 전용 직업: 기사·궁수·마법사·치유사·암살자)"
        - " <cmd:'/게임 시작 ':'/게임 시작'> <dark_gray>-</dark_gray> <gray>모드를 생략하면 순환 목록의 다음 게임"
    flow:
      title: "<#ffb347><bold>▸ 진행</bold>"
      play:
        - " <cmd:'/게임 목록'> <dark_gray>-</dark_gray> <gray>미니게임 목록"
        - " <cmd:'/게임 참가'> <dark_gray>/</dark_gray> <cmd:'/게임 관전'> <dark_gray>-</dark_gray> <gray>다음 경기 참가 / 관전 선택"
      admin:
        - " <cmd:'/게임 중지'> <dark_gray>-</dark_gray> <gray>경기 강제 종료 및 복구"
        - " <cmd:'/게임 순환 ':'/게임 순환 [켜기|끄기|목록]'> <dark_gray>-</dark_gray> <gray>경기가 끝나면 다음 게임 자동 시작"
    match:
      title: "<#ffb347><bold>▸ 경기 중</bold> <dark_gray>(어느 모드든)"
      play:
        - " <cmd:'/게임 리롤'> <dark_gray>-</dark_gray> <gray>능력 다시 뽑기 (준비 시간) · 증강 카드 다시 뽑기"
        - " <cmd:'/게임 내정보'> <dark_gray>-</dark_gray> <gray>내 능력 · 증강 · 레벨"
        - " <cmd:'/게임 팀'> <dark_gray>-</dark_gray> <gray>팀원과 팀원의 능력"
        - " <cmd:'/게임 점수'> <dark_gray>-</dark_gray> <gray>지금 점수 (공성전)"
      admin: []
    practice:
      title: "<#7bd88f><bold>▸ 연습</bold> <dark_gray>(시작은 관리자, 참가는 누구나)"
      play:
        - " <cmd:'/게임 시작 초능력전쟁 연습 ':'/게임 시작 초능력전쟁 연습 [능력]'> <dark_gray>-</dark_gray> <gray>허수아비로 능력 연습 (진행 중이면 참가 · 능력 바꾸기)"
        - " <cmd:'/게임 시작 증강 연습'> <dark_gray>-</dark_gray> <gray>새 야생 월드에서 증강 연습 (진행 중이면 참가)"
        - " <cmd:'/게임 연습 허수아비 ':'/게임 연습 허수아비 [개수]'> <dark_gray>-</dark_gray> <gray>허수아비 다시 세우기"
        - " <gray>능력 연습: <cmd:'/게임 연습 바꾸기 ':'바꾸기 [능력]'> <dark_gray>·</dark_gray> <cmd:'/게임 연습 충전':'충전'> <dark_gray>-</dark_gray> <gray>능력 바꾸기, 궁극기 충전"
        - " <gray>증강 연습: <cmd:'/게임 연습 받기 ':'받기 [증강]'> <dark_gray>·</dark_gray> <cmd:'/게임 연습 빼기 ':'빼기 [증강|전부]'> <dark_gray>·</dark_gray> <cmd:'/게임 연습 카드 ':'카드 [등급]'> <dark_gray>·</dark_gray> <cmd:'/게임 연습 다음단계':'다음단계'> <dark_gray>·</dark_gray> <cmd:'/게임 연습 대전 ':'대전 [켜기|끄기]'>"
      admin:
        - " <cmd:'/게임 연습 쿨타임 ':'/게임 연습 쿨타임 [켜기|끄기]'> <dark_gray>-</dark_gray> <gray>능력 연습의 액티브 쿨타임"
        - " <cmd:'/게임 시작 초능력전쟁 연습 모두'> <dark_gray>/</dark_gray> <cmd:'/게임 시작 증강 연습 모두':'증강 연습 모두'> <dark_gray>-</dark_gray> <gray>접속 중인 모두와 연습"
        - " <cmd:'/게임 연습 다음단계'> <dark_gray>-</dark_gray> <gray>진짜 증강 경기에서도 단계 건너뛰기 (파밍 → 전투 → 보더 축소 → 최종)"
    modes:
      title: "<#a78bfa><bold>▸ 모드별</bold>"
      play:
        - " <cmd:'/게임 능력 목록'> <dark_gray>·</dark_gray> <cmd:'/게임 능력 정보 ':'정보 [능력]'> <dark_gray>·</dark_gray> <cmd:'/게임 능력 선택':'선택'> <dark_gray>-</dark_gray> <gray>초능력: 능력 목록, 설명, 닫은 선택 창 다시 열기"
        - " <cmd:'/게임 증강'> <dark_gray>·</dark_gray> <cmd:'/게임 증강 목록':'목록'> <dark_gray>·</dark_gray> <cmd:'/게임 증강 정보 ':'정보 [증강]'> <dark_gray>·</dark_gray> <cmd:'/게임 증강 보너스':'보너스'> <dark_gray>-</dark_gray> <gray>증강: 닫은 카드 창 다시 열기, 목록, 설명, 보너스 조건"
        - " <cmd:'/게임 증강 관전 ':'/게임 증강 관전 [봇|다음]'> <dark_gray>-</dark_gray> <gray>봇 관전전: 봇 순위, 봇 따라가기"
      admin:
        - " <cmd:'/게임 능력 지정 ':'/게임 능력 지정 [플레이어] [능력]'> <dark_gray>·</dark_gray> <cmd:'/게임 능력 선택방식 ':'선택방식 [RANDOM|CHOICE]'> <dark_gray>-</dark_gray> <gray>능력 지정, 배정 방식"
        - " <cmd:'/게임 증강 배속 ':'/게임 증강 배속 [1~4]'> <dark_gray>-</dark_gray> <gray>봇 경기의 시간 배속"
        - " <cmd:'/게임 공성전 능력풀 ':'/게임 공성전 능력풀 [목록|추가|제거|초기화]'> <dark_gray>-</dark_gray> <gray>공성전에서 나오는 능력"
        - " <cmd:'/게임 공성전 봇'> <dark_gray>-</dark_gray> <gray>공성전 봇전: 봇마다 직업·라인·레벨·체력·하는 일"
    map:
      title: "<#ff7f50><bold>▸ 맵</bold>"
      play: []
      admin:
        - " <cmd:'/게임 맵'> <dark_gray>-</dark_gray> <gray>지금 경기장과 내장 전투 맵 목록"
        - " <cmd:'/게임 맵 ':'/게임 맵 [맵]'> <dark_gray>·</dark_gray> <cmd:'/게임 맵 ':'[맵] 이동'> <dark_gray>·</dark_gray> <cmd:'/게임 맵 ':'[맵] 다시짓기'> <dark_gray>-</dark_gray> <gray>맵을 지어(처음 한 번) 경기장으로 사용, 구경하러 가기, 처음 상태로"
        - " <cmd:'/게임 맵 여기 ':'/게임 맵 여기 [반경]'> <dark_gray>/</dark_gray> <cmd:'/게임 맵 해제':'해제'> <dark_gray>-</dark_gray> <gray>내 위치를 경기장으로 / 경기장 해제 (시작한 사람 위치에서 경기)"
    server:
      title: "<#ff7f50><bold>▸ 서버</bold>"
      play:
        - " <cmd:'/게임 리소스팩'> <dark_gray>·</dark_gray> <cmd:'/게임 리소스팩 다시받기':'다시받기'> <dark_gray>-</dark_gray> <gray>리소스팩 확인, 다시 받기"
      admin:
        - " <cmd:'/게임 설정'> <dark_gray>·</dark_gray> <cmd:'/게임 설정 목록':'목록'> <dark_gray>-</dark_gray> <gray>설정 메뉴 (팀 인원, 상자, 자기장 …), 현재 값과 명령어"
        - " <cmd:'/게임 리로드'> <dark_gray>-</dark_gray> <gray>설정 다시 불러오기"

# ── 목록 (/게임 목록) ────────────────────────────────────────
list:
  header: "<gradient:#ffb347:#ff5e62><bold>미니게임</bold></gradient> <gray><count>종"
  entry: " <dark_gray>▪</dark_gray> <game> <dark_gray>(<id>)</dark_gray> <gray>최소 <white><min></white>명 · <mode></gray><status>"
  description: "    <gray><line>"
  teams-yes: "개인전/팀전"
  teams-no: "개인전"
  status-running: " <green>● 진행 중</green>"
  status-next: " <yellow>▶ 다음 순서</yellow>"

# ── 명령어 응답 ──────────────────────────────────────────────
command:
  stopped: "<yellow>경기를 중지했습니다. 모두 경기 전 상태로 복구됩니다."
  rotation-cancelled: "<yellow>대기 중이던 다음 경기를 취소했습니다. <gray>(순환 모드는 켜져 있으며, 다음 경기가 끝나면 다시 이어집니다)"
  join: "<green>다음 경기부터 <bold>참가</bold>합니다."
  join-now: "<green>경기에 합류했습니다!"
  join-already: "<gray>이미 경기에 참가 중입니다."
  join-next-match: "<green>다음 경기부터 참가합니다. <gray>(지금은 관전 중)"
  spectate: "<yellow>다음 경기부터 <bold>관전</bold>합니다. <gray>참가하려면 <white>/게임 참가</white>"
  spectate-next-match: "<yellow>다음 경기부터 관전합니다. <gray>(이번 경기는 끝까지 진행됩니다)"
