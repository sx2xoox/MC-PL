# ── 순환 모드 ────────────────────────────────────────────────
rotation:
  announce: "<aqua>순환 모드</aqua> <gray>· <game><gray> 경기가 <white><seconds></white>초 후 시작됩니다. <dark_gray>(관전하려면 /게임 관전)"
  bossbar-countdown: "<yellow>다음 게임</yellow> <white><game></white> <gray>· <white><seconds></white>초 후 시작"
  bossbar-waiting: "<gray>다음 게임</gray> <white><game></white> <gray>· 인원 대기 중 <white><count></white>/<white><min></white>"

# ── 설정 (/게임 설정) ────────────────────────────────────────
settings:
  "on": "<green>켜짐"
  "off": "<red>꺼짐"
  # 숫자 표시 (<value> = 숫자, <duration> = 1분 이상일 때 "2분 30초")
  unit:
    seconds: "<white><value>초"
    minutes: "<white><duration></white> <dark_gray>(<value>초)"
    blocks: "<white><value>블록"
    players: "<white><value>명"
    count: "<white><value>개"
    times: "<white><value>회"
    multiplier: "<white>×<value>"
    percent: "<white><value>%"
  # 명령어로 바꿨을 때 (채팅)
  changed: "<gray><name></gray> <dark_gray>→</dark_gray> <value> <dark_gray>(config.yml 에 저장됨)"
  unchanged: "<gray><name></gray> <dark_gray>:</dark_gray> <value> <dark_gray>(이미 이 값입니다)"
  # 디스크가 가득 찼거나 폴더에 쓸 수 없을 때 (콘솔 로그에 원인)
  save-failed: "<red><name> → <value> 로 바꿨지만 config.yml 에 저장하지 못했습니다. <gray>서버를 다시 켜면 사라집니다. (콘솔 로그 참고)"
  clamped: "<gray>입력한 값이 범위를 벗어나 가장 가까운 값으로 맞췄습니다. <dark_gray>범위: <min> ~ <max>"
  # 곧 시작할 경기(카운트다운 중)에도 적용되는 변경
  applies-this-match: "<gray>카운트다운 중인 경기에도 적용됩니다."
  current: "<gray><name></gray> <dark_gray>:</dark_gray> <value> <dark_gray>· 바꾸려면 <white><usage>"
