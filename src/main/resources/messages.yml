      name: "<yellow>◀ 이전 쪽"
      lore: []
    next:
      name: "<yellow>다음 쪽 ▶"
      lore: []
    status-idle:
      name: "<green>대기 중"
      lore:
        - "<gray>바꾼 설정은 다음 경기부터 적용됩니다."
