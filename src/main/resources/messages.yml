  eliminated-subtitle-killer: "<gray>처치자 <killer>"
  respawn-title: "<red><bold>사망!"
  respawn-subtitle: "<gray><white><seconds></white>초 후 부활합니다"
  aborted: "<red>경기가 중단되었습니다. <gray>(<reason><gray>)"
  reason-admin: "<white><player></white>님이 경기를 중지함"
  reason-not-enough: "인원 부족: <white><count></white>/<white><min></white>명"
  reason-no-viewers: "관전할 사람이 없습니다"
  reason-error: "내부 오류"
  reason-shutdown: "서버 종료"
  restored: "<gray>경기 전 상태(인벤토리·위치·체력·경험치)로 복구되었습니다."
  restored-pending: "<gray>지난 경기에서 저장된 원래 상태로 복구되었습니다."
  snapshot-failed: "<red>원래 상태(인벤토리·위치)를 디스크에 저장하지 못해 이번 경기에서 제외되었습니다. <gray>관리자에게 알려 주세요."

