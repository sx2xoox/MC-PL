match:
  starting: "<game> <white>경기를 시작합니다! <gray>참가자 <white><count></white>명 · <white><seconds></white>초 후 시작"
  starting-watch: "<game> <white>경기를 시작합니다! <gray>모두 관전합니다 · <white><seconds></white>초 후 시작"
  countdown-title: "<gradient:#ffb347:#ff5e62><bold><seconds></bold></gradient>"
  countdown-subtitle: "<game> <gray>시작까지"
  start-title: "<gradient:#ffb347:#ff5e62><bold>START!</bold></gradient>"
  start-subtitle: "<game>"
  team-assigned: "<gray>당신은 <team><gray>입니다. 팀원: <members>"
