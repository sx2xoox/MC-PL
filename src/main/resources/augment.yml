  chat-line: "\\<<name>> <message>"
  bad-option: "<red>'<white><input></white>'(을)를 알 수 없습니다. <gray>사용법: <white>/게임 증강 봇전 [봇 수] [쉬움|보통|어려움|지옥]</white> <dark_gray>(섞기: 쉬움 3 어려움 2 · 팀전: 팀 3 4 보통)"
  team-bad-option: "<red>'<white><input></white>'(을)를 알 수 없습니다. <gray>사용법: <white>/게임 증강 봇전 [관전] 팀 [팀당 인원] [팀 수] [난이도]</white> <dark_gray>(예: 팀 3 4 보통, 팀 2 3 쉬움 3 어려움 2)"
