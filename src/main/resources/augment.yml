# ─────────────────────────────────────────────────────────────
#  증강 야생전 메시지 (MiniMessage 형식: https://docs.advntr.dev/minimessage/format)
#  prefix 를 지정하지 않으면 messages.yml 의 prefix 를 그대로 씁니다.
#  <augment>, <player>, <seconds> 같은 꺾쇠 이름은 자동으로 채워집니다.
#  이 파일에 없는 키는 플러그인에 내장된 기본 문구를 사용합니다. 수정 후 /게임 리로드
# ─────────────────────────────────────────────────────────────

# ── 게임 소개 ────────────────────────────────────────────────
game:
  name: "<gradient:#7bd88f:#d58cff><bold>증강 야생전</bold></gradient>"
  description:
    - "경기마다 새로 만든 야생 월드에서 파밍하고, PvP가 켜지면 좁아지는 월드보더 안에서 최후의 1인(팀)을 가립니다."
    - "정해진 시간과 특별한 업적마다 <white>증강</white> 카드 3장 중 하나를 고릅니다 (증강 <count>종)."
    - "<click:suggest_command:'/게임 증강'><hover:show_text:'<gray>클릭하여 입력'><white>/게임 증강</white></hover></click> <gray>증강 선택 · 목록 · 보너스 조건"

# ── 등급 ─────────────────────────────────────────────────────
tier:
  silver: "<#c9d6df><bold>실버</bold></#c9d6df>"
  gold: "<#ffc83d><bold>골드</bold></#ffc83d>"
  prism: "<gradient:#7bd8ff:#d58cff:#ff8cc6><bold>프리즘</bold></gradient>"

# ── 보스바 ───────────────────────────────────────────────────
bar:
  preparing: "<gray>새 야생 월드를 만드는 중 <white><percent>%</white> <dark_gray>(<done>/<total> 청크)"
  farming: "<green><bold>파밍</bold></green> <gray>· PvP 시작까지 <white><time>"
  fight-wait: "<red><bold>전투</bold></red> <gray>· 월드보더 <white><size></white>칸 · 축소까지 <white><time>"
  fight-shrink: "<red><bold>전투</bold></red> <gray>· 월드보더 <white><size></white>칸으로 줄어드는 중 · <white><time>"
  fight-final: "<dark_red><bold>최종 구역</bold></dark_red> <gray>· 월드보더 <white><size></white>칸 · 생존 <white><alive>명"
  practice: "<green><bold>증강 연습</bold></green> <gray>· 전투로 넘어가기 <white>/게임 증강 다음단계</white> · 끝내기 <white>/게임 중지"

# ── 진행 ─────────────────────────────────────────────────────
phase:
  preparing: "<gray>새 야생 월드를 만드는 중입니다. 보스바에 진행률이 나오며, 다 되면 모두 월드 곳곳으로 흩어집니다."
  farming-title: "<green><bold>파밍 시작!</bold>"
  farming-subtitle: "<gray>PvP는 <white><time></white> 뒤에 켜집니다"
  farming: "<green>파밍 시작!</green> <gray>새 야생 월드에 흩어졌습니다. <white><time></white> 동안 플레이어끼리는 공격할 수 없습니다. 증강 라운드 <white><rounds></white>번이 기다립니다."
  farming-grace: "<gray>파밍 시간에는 모두(봇 포함) <white>무적</white>이고 <white>배고프지 않습니다</white>. 전투가 시작되면 끝납니다."
  farming-invulnerable: "<gray>파밍 시간에는 모두(봇 포함) <white>무적</white>입니다. 전투가 시작되면 끝납니다."
  farming-no-hunger: "<gray>파밍 시간에는 <white>배고프지 않습니다</white>. 몹·낙하·용암은 위험합니다."
  fight-title: "<red><bold>PvP 시작!</bold>"
  fight-subtitle: "<gray>최후의 1인(팀)이 될 때까지"
  fight: "<red>PvP가 켜졌습니다!</red> <gray>월드보더는 <white><time></white> 뒤부터 한 변 <white><size></white>칸까지 줄어듭니다."
  border-shrinking: "<gold>월드보더가 줄어들기 시작합니다!</gold> <gray><white><time></white>에 걸쳐 한 변 <white><size></white>칸까지. 보더 밖에서는 피해를 받습니다."
  final: "<dark_red>최종 구역!</dark_red> <gray>월드보더가 다 줄었습니다."
  final-glow: "<dark_red>최종 구역!</dark_red> <gray>월드보더가 다 줄었습니다. 살아 있는 모두가 <white>발광</white>합니다."

# ── 증강 라운드 ──────────────────────────────────────────────
round:
  title: "<tier> <white>증강"
  subtitle: "<gray><round>번째 증강 라운드 · 카드 3장 중 하나를 고르세요"
  announce: "<white><round>번째 증강 라운드:</white> <tier> <dark_gray>(<chances>)"
  chance: "<tier> <gray><percent>%"

source:
  round: "<round>번째 라운드"
  bonus: "보너스 · <condition>"
  augment: "증강 · <augment>"
  practice: "연습"

# ── 카드 선택 ────────────────────────────────────────────────
offer:
  menu-title: "<tier> <dark_gray>증강 선택 · <source>"
  clock: "<yellow>남은 시간 <white><seconds>초</white> <gray>(시간이 지나면 무작위)"
  card-kind: "<tier> <dark_gray>·</dark_gray> <gray><kind>"
  card-line: "<white><text>"
  card-pick: "<green>▶ 클릭하여 선택"
  reroll-name: "<aqua>리롤</aqua> <gray>(<white><count></white>회 남음)"
  reroll-none: "<red>리롤 없음"
  reroll-lore:
    - "<gray>보이는 카드를 모두 다시 뽑습니다."
    - "<gray>리롤은 경기 전체에서 정해진 횟수만 쓸 수 있습니다."
  picked: "<augment> <green>증강을 얻었습니다!</green> <gray><description>"
  timeout: "<yellow>시간 초과!</yellow> <gray>무작위로</gray> <augment> <gray>증강을 얻었습니다. <description>"
  none-left: "<gray>더 받을 수 있는 증강이 없습니다."
  queued: "<gray>고를 증강이 <white><count></white>개 쌓여 있습니다. 지금 것을 고르면 다음 것이 열립니다."
  no-rerolls: "<red>리롤이 남아 있지 않습니다."
  rerolled: "<aqua>카드를 다시 뽑았습니다.</aqua> <gray>(리롤 <white><count></white>회 남음)"
  closed: "<yellow>증강을 아직 고르지 않았습니다.</yellow> <click:run_command:'/게임 증강'><hover:show_text:'<gray>클릭하여 다시 열기'><white>[여기를 클릭]</white></hover></click> <gray>또는 <white>/게임 증강</white> 으로 다시 열 수 있습니다 (<white><seconds>초</white> 뒤 무작위)."
  # 대화창 (games.augment.augments.ui: DIALOG)
  dialog-title: "<white><bold>증강 선택</bold></white> <dark_gray>·</dark_gray> <tier>"
  dialog-external-title: "<white>증강 선택"
  dialog-header: "<gray><source></gray> <dark_gray>·</dark_gray> <white>카드를 하나 고르세요"
  dialog-queued: "<dark_gray>이 다음에 고를 증강이 <white><count></white>개 더 있습니다"
  dialog-card: "<name> <dark_gray>·</dark_gray> <gray><kind></gray><newline><white><description>"
  dialog-card-label: "<name>"
  dialog-card-tooltip: "<name> <dark_gray>·</dark_gray> <tier> <gray><kind></gray><newline><white><description></white><newline><newline><green>▶ 클릭하여 선택"
  dialog-countdown: "<yellow><seconds>초</yellow> <gray>안에 고르지 않으면 보이는 카드 중 <white>무작위</white>로 하나를 받습니다"
  dialog-countdown-urgent: "<red><bold><seconds>초</bold></red> <gray>안에 고르지 않으면 보이는 카드 중 <white>무작위</white>로 하나를 받습니다"
  dialog-reroll: "<aqua>다시 뽑기</aqua> <gray>(<white><count></white>회 남음)"
  dialog-reroll-tooltip: "<gray>보이는 카드를 모두 다시 뽑습니다.<newline>리롤은 경기 전체에서 정해진 횟수만 쓸 수 있습니다."
  dialog-later: "<gray>나중에 고르기"
  dialog-later-tooltip: "<gray>창을 닫습니다 (ESC도 같음).<newline><white>/게임 증강</white> 으로 다시 열 수 있고, 시간이 지나면 무작위로 받습니다."
  reminder: "<yellow>증강 선택 대기 중</yellow> <gray>· <white>/게임 증강</white> · <white><seconds>초</white> 뒤 무작위"

# ── 보너스 증강 ──────────────────────────────────────────────
bonus:
  announce: "<player> <gray>님이 <gold>[<condition>]</gold> 달성! <dark_gray>(<description>)</dark_gray> <tier> <gray>보너스 증강을 받습니다."
  announce-first: "<player> <gray>님이 가장 먼저 <gold>[<condition>]</gold> 달성! <dark_gray>(<description>)</dark_gray> <tier> <gray>보너스 증강을 받습니다."

# ── 경기 결과 ────────────────────────────────────────────────
summary:
  header: "<gradient:#7bd88f:#d58cff><bold>이번 경기의 증강</bold></gradient>"
  row: " <dark_gray>▪</dark_gray> <player><gray>: <augments>"
  none: "<dark_gray>없음"

# ── 사이드바 ─────────────────────────────────────────────────
hud:
  farming: "<green>파밍</green> <gray>PvP까지 <white><time>"
  fight: "<red>전투</red> <gray>월드보더 <white><size></white>칸"
  next-round: "<aqua><round>번째 증강</aqua> <gray>까지 <white><time>"
  rounds-done: "<dark_gray>증강 라운드 끝"
  alive: "<gray>생존자 <white><alive>명"
  team: "<team> <bar> <white><percent>%</white> <gray><alive>/<size>"
  kills: "<gray>내 킬 <red><kills>"
  augments: "<gold>내 증강 <white><count></white> <dark_gray>(리롤 <rerolls>)"
  no-augments: " <dark_gray>아직 없음"
  augment: " <dark_gray>▸</dark_gray> <augment>"
  more: " <dark_gray>외 <count>개 (/게임 증강)"
  pending: "<yellow>⚑ 고를 증강 <count>개 <gray>(/게임 증강)"
  spectating: "<dark_gray>관전 중"
  time-scale: "<aqua>배속 x<scale>"
  practice-farming: "<green>연습</green> <gray>파밍 (PvP 꺼짐)"
  practice-pvp-on: "<gray>연습 대전 <red>켜짐"
  practice-pvp-off: "<gray>연습 대전 <dark_gray>꺼짐"

# ── 규칙 ─────────────────────────────────────────────────────
rules:
  ender-chest: "<red>경기 중에는 엔더 상자를 열 수 없습니다."

# ── 증강 효과 ────────────────────────────────────────────────
augment-fx:
  phoenix: "<gold>불사조의 깃털</gold><gray>이 타올라 죽음을 피했습니다!"
  # Group B
  shadow-ready: "<dark_purple>그림자 일격</dark_purple><gray> 준비: 투명한 동안 다음 근접 공격이 강해집니다"
  war-god: "<red>전쟁의 신</red><gray>: 공격력 강화 <white><stacks></white>단계"
  # Group C
  cooldown: "<augment> <gray>재사용까지 <white><seconds>초"
  blink-blocked: "<gray>앞이 막혀 있어 <white>점멸</white>할 수 없습니다."
  rewind: "<aqua>시간 역행</aqua><gray>: <white><seconds>초</white> 전으로 돌아갔습니다."
  hidden: "<dark_gray>잠복 중 <gray>· 움직이거나 싸우면 모습이 드러납니다"
  compass-idle: "<gray>추적 나침반은 <red>PvP</red>가 켜진 뒤에 작동합니다."
  compass-target: "<red><arrow></red> <white><target></white> <gray>· <white><distance></white>블록"
  vengeful: "<dark_purple>복수의 영혼</dark_purple><gray>이 나를 쓰러뜨린 적에게 깃들었습니다. 그 적은 시들어 가며 모두에게 보입니다."

# ── 증강 연습 (/게임 증강 연습) ──────────────────────────────
practice:
  name: "<gradient:#7bd88f:#4fc3f7><bold>증강 연습</bold></gradient>"
  description:
    - "증강 야생전을 혼자서도: 새 야생 월드에서 증강을 마음대로 받고 빼고, 허수아비로 시험합니다."
    - "<white>/게임 증강 연습</white> <gray>시작(관리자) · 참가"
  title: "<gradient:#7bd88f:#4fc3f7><bold>증강 연습</bold></gradient>"
  subtitle: "<gray>/게임 증강 받기 · 카드 · 허수아비 · 다음단계"
  started: "<green>증강 연습을 시작합니다.</green> <gray>증강 라운드는 없고 단계는 <white>/게임 증강 다음단계</white>로 넘깁니다. <white>/게임 증강 받기 \\<증강></white>, <white>빼기</white>, <white>카드</white>, <white>허수아비</white>, <white>대전</white>을 쓸 수 있습니다. 끝내려면 <white>/게임 중지</white>."
  starting: "<green>증강 연습을 준비합니다.</green> <gray>새 야생 월드를 만드는 중입니다."
  start-admin-only: "<red>증강 연습은 관리자만 시작할 수 있습니다. 진행 중인 연습에는 누구나 참가할 수 있습니다."
  real-match: "<red>지금은 진짜 경기 중이라 연습 명령어를 쓸 수 없습니다."
  no-session: "<red>진행 중인 증강 연습이 없습니다. <gray>관리자가 <white>/게임 증강 연습</white>으로 시작합니다."
  not-started: "<red>연습 월드가 아직 준비 중입니다."
  not-participant: "<red>연습에 참가한 플레이어만 쓸 수 있습니다. <gray><white>/게임 증강 연습</white>으로 참가하세요."
  joined-countdown: "<green>증강 연습에 참가합니다."
  already-in: "<gray>이미 연습 중입니다."
  not-now: "<red>지금은 참가할 수 없습니다."
  join-failed: "<red>연습에 참가하지 못했습니다."
  everyone-left: "연습하는 플레이어가 없습니다"
  usage-give: "<gray>사용법: <white>/게임 증강 받기 \\<증강 이름 또는 id></white>"
  usage-take: "<gray>사용법: <white>/게임 증강 빼기 \\<증강 이름 또는 id | 전부></white>"
  already-owned: "<gray>이미 <augment><gray>을(를) 가지고 있습니다."
  not-owned: "<red><augment><red>은(는) 가지고 있지 않습니다."
  took: "<augment><gray>을(를) 뺐습니다."
  took-all: "<gray>증강 <white><count></white>개를 모두 뺐습니다."
  unknown-tier: "<red>'<white><input></white>'(이)라는 등급은 없습니다. <gray>실버, 골드, 프리즘 중에서 고르세요."
  next-fight: "<red>PvP 단계</red><gray>로 넘어갑니다 (<player>). 전투용 증강이 반응하고, 월드보더가 곧 줄어듭니다."
  next-shrink: "<gold>월드보더가 지금 줄어들기 시작합니다</gold> <gray>(<player>)."
  next-final: "<dark_red>월드보더가 최종 크기가 됩니다</dark_red> <gray>(<player>)."
  next-none: "<gray>더 넘길 단계가 없습니다."
  dummies-placed: "<green>허수아비 <white><count></white>개를 세웠습니다.</green> <gray>모든 증강에 적으로 취급되고, 죽이면 처치로 인정됩니다."
  dummies-failed: "<red>허수아비를 세우지 못했습니다."
  dummy-name: "<red>허수아비"
  dummy-health: "<red>❤ <white><health></white><gray> / <max>"
  pvp-current: "<gray>연습 대전(플레이어끼리 공격): <state>"
  state-on: "<green>켜짐"
  state-off: "<red>꺼짐"
  pvp-on: "<red>연습 대전이 켜졌습니다</red> <gray>(<player>): 연습하는 플레이어끼리 공격할 수 있습니다."
  pvp-off: "<gray>연습 대전이 꺼졌습니다 (<player>): 플레이어끼리 공격할 수 없습니다."

# ── 봇전 (/게임 증강 봇전) ───────────────────────────────────
bots:
  name: "<gradient:#7bd88f:#ff8c8c><bold>증강 봇전</bold></gradient>"
  game-description:
    - "봇이 빈자리를 채우는 진짜 증강 야생전. 혼자서도 할 수 있습니다."
