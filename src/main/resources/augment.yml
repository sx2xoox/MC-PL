    zero: "<aqua>바로 축소"
  border-shrink:
    name: "월드보더 축소 시간"
    lore:
      - "<gray>월드보더가 최종 크기까지 줄어드는 데 걸리는 시간"
    zero: "<aqua>한 번에"
  border-final:
    name: "최종 월드보더 크기"
    lore:
      - "<gray>마지막 구역 한 변의 길이"
  glow:
    name: "최종 구역 발광"
    lore:
      - "<gray>월드보더가 다 줄면 살아 있는 모두가 발광합니다."
