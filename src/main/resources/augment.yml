      - "<gray>마을·폐광·난파선 같은 구조물과 보물 상자"
  pregenerate:
    name: "월드 미리 생성"
    lore:
      - "<gray>파밍 전에 플레이 구역을 미리 만들어 둡니다."
      - "<gray>끄면 바로 시작하지만 처음 몇 분 동안 서버가 무거울 수 있습니다."
  choice:
    name: "증강 선택 시간"
    lore:
      - "<gray>카드 3장 중 하나를 고르는 시간입니다."
      - "<gray>시간이 지나면 무작위로 하나를 받습니다."
  ui:
    name: "증강 선택 화면"
    lore:
      - "<gray>대화창: 카드가 나란히 뜨는 선택 화면 (기본)"
      - "<gray>상자: 예전 상자 메뉴 (대화창이 안 보이는 클라이언트용)"
    option:
      dialog: "<aqua>대화창"
      chest: "<gold>상자"
  rerolls:
    name: "증강 리롤 횟수"
    lore:
      - "<gray>경기 전체에서 카드를 다시 뽑을 수 있는 횟수"
    zero: "<red>리롤 없음"
  bonus:
    name: "보너스 증강"
    lore:
      - "<gray>첫 번째 피, 심연의 광부 같은 업적을 달성하면"
      - "<gray>증강을 하나 더 받습니다 (조건은 augments.yml)."
  bot-chat:
    name: "봇 채팅"
    lore:
      - "<gray>봇전·봇 관전전에서 봇이 플레이어처럼 채팅합니다."
      - "<gray>상황마다 확률로만, 봇마다 20~40초에 한 줄까지."
      - "<gray>문구: augment-bots-chat.yml"
  bot-chat-chance:
    name: "봇 채팅 확률 배율"
    lore:
      - "<gray>모든 상황의 말할 확률에 곱합니다."
      - "<gray>상황별 확률: config.yml 의 bots.chat.chances"
  bot-team-cohesion:
    name: "봇 팀 뭉침 거리"
    lore:
      - "<gray>봇전 팀전: 봇이 팀장(사람 팀원, 없으면 가장 강한 봇)에게서"
      - "<gray>이 거리 안에 머물고, 멀어지면 다시 합류합니다."
  bot-team-base:
    name: "봇 팀 기지"
    lore:
      - "<gray>봇전 팀전: 팀의 기지 짓는 봇들이 기지 하나를 함께 짓고 지킵니다."
      - "<gray>끄면 봇마다 자기 기지를 짓습니다."
  bot-team-chat:
    name: "봇 팀 채팅"
    lore:
      - "<gray>봇전 팀전: 합류, 도움 요청, 집중 공격, 팀원 사망·처치, 팀 우승 대사"
    zero: "<red>말 안 함"
