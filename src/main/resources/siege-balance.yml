# 공성전 능력별 피해 보정 (자동 생성: ./gradlew updateSiegeBalance → SiegeBalanceReport). 직접 고치지 마세요.
# 서버에서 바꾸려면 config.yml 의 games.siege.balance.abilities.<능력>.skill / .ultimate 를 고칩니다.
# skill = 액티브·패시브 피해, ultimate = 궁극기 피해. 전체 배율(balance.ability-damage 0.65) 위에 곱합니다.
