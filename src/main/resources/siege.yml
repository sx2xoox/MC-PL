# ─────────────────────────────────────────────────────────────
#  초능력 공성전 메시지 (MiniMessage 형식: https://docs.advntr.dev/minimessage/format)
#  prefix 를 지정하지 않으면 messages.yml 의 prefix 를 그대로 씁니다.
#  이 파일에 없는 키는 플러그인에 내장된 기본 문구를 사용합니다. 수정 후 /게임 리로드
# ─────────────────────────────────────────────────────────────

game:
  name: "<gradient:#f59e0b:#ef4444><bold>초능력 공성전</bold></gradient>"
  description:
    - "두 팀이 번갈아 공격과 수비를 하며 타워 3개를 부수는 팀전 (3판 2선승)."
    - "초능력전쟁의 능력을 쓰고, 죽어도 잠시 뒤 부활합니다. 판마다 능력을 새로 뽑습니다."
    - "<click:suggest_command:'/게임 공성전'><hover:show_text:'<gray>클릭하여 입력'><white>/게임 공성전</white></hover></click> <gray>점수 · 리롤 · 능력풀"

start:
