tutorial:
  title-1: "<aqua><bold>라인을 밀어라"
  subtitle-1: "<gray>위·아래 두 라인, 바깥 타워부터 부숴야 안쪽이 열립니다"
  title-2: "<gold><bold>코어를 부수면 승리"
  subtitle-2: "<gray>안쪽 타워를 모두 부수면 상대 코어의 보호막이 꺼집니다"
  title-3: "<yellow><bold>점수로도 이긴다"
  subtitle-3: "<gray>20분이 끝나면 점수 높은 팀 승리 · 죽어도 본진에서 부활"
  summary:
    - "<gold>── 공성전 규칙 ──"
    - "<gray>• 우리 팀은 <white>본진 성</white>에서 시작합니다. <white>위·아래 두 라인</white>에 팀마다 타워 2개, 본진에 <white>코어</white> 1개."
    - "<gray>• <white>바깥 타워</white>가 서 있으면 그 라인의 안쪽 타워는 <aqua>보호막</aqua>, <white>안쪽 타워</white>가 하나라도 서 있으면 코어도 보호막."
    - "<gray>• <white>상대 코어 파괴 = 즉시 판 승리.</white> 아니면 <white>20분</white> 뒤 점수가 높은 팀 승리 (처치 +2, 도움 +1, 타워 +8)."
    - "<gray>• 죽으면 잠시 뒤 본진에서 부활하고 3초 동안 무적. 능력은 처음부터 모두 씁니다 (레벨은 강화만)."
    - "<gray>• 검 <white>우클릭</white> = 액티브, <white>F</white> = 궁극기. 화면 아래 <gold>▶ 지금 할 일</gold>을 따라가세요. <white>3판 2선승.</white>"

