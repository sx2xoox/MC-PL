    name: "공격팀 1명당 타워 체력"
    lore:
      - "<gray>타워 체력 = 설정 체력 × (기본 비율 + 이 값 × 공격팀 인원)"
      - "<gray>인원이 많을수록 타워가 단단해집니다."
  max-level:
    name: "최대 레벨"
    lore:
      - "<gray>반마다 1레벨에서 시작해 이 레벨까지 오릅니다."
      - "<gray>레벨이 오르면 액티브·궁극기가 열리고 최대 체력이 늘어납니다."
  passive-xp:
    name: "기본 경험치 (초당)"
    lore:
      - "<gray>싸우는 동안 1초마다 모두가 받는 경험치"
    zero: "<red>없음"
  node-capture:
    name: "데이터 노드 점령 시간"
    lore:
      - "<gray>한 팀만 노드 안에 이 시간 동안 있으면 점령합니다."
  core-interval:
    name: "오버클럭 코어 주기"
    lore:
      - "<gray>오버클럭 코어가 점령된 뒤 다시 나타나기까지의 시간"

