  already: "<red><ability><red> 은(는) 이미 능력풀에 있습니다."
  added: "<green><ability><green> 을(를) 공성전 능력풀에 추가했습니다. <gray>(<count>개, 다음 판부터)"
  disabled-warning: "<yellow><ability><yellow> 은(는) abilities.yml 에서 꺼져 있어 켤 때까지 나오지 않습니다."
  not-in-pool: "<red>'<input>' 은(는) 능력풀에 없습니다."
  removed: "<green><ability><green> 을(를) 공성전 능력풀에서 뺐습니다. <gray>(<count>개)"
  reset: "<green>공성전 능력풀을 기본값으로 되돌렸습니다. <gray>(<count>개)"

half:
  first: "전반"
  second: "후반"
  title: "<gold><bold><round>판 <half>"
  subtitle: "<team><gray> 공격"
