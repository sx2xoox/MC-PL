  health-announce: "<gray><tower><gray> 체력 <red><percent>%</red> 남음"
  destroyed-title: "<red><bold><tower> 파괴!"
  destroyed-subtitle: "<team><gray> <gold>+<points>점"
  destroyed: "<red>💥 <tower> 파괴!</red> <player><gray> (<team><gray>) <gold>+<points>점"
  next: "<gray>이제 <white><tower></white>을(를) 공격할 수 있습니다. 수비 부활 지점이 뒤로 물러납니다."
  defended: "<green>🛡 방어 성공!</green> <team><gray> 이(가) <white><tower></white>을(를) 지켜 냈습니다 <gold>+<points>점</gold><gray>, 타워 체력 회복"

climax:
  title: "<red><bold>총공세!"
  subtitle: "<gray>타워 점수 <gold>×<multiplier></gold> · 부활 <white><seconds>초</white> 빨라짐"
  announce: "<red><bold>총공세!</bold></red><gray> 이 반의 남은 시간 동안 타워 파괴 점수 <gold>×<multiplier></gold>, 양 팀 부활 대기 <white><seconds>초</white> 감소"

spawn:
  zone-warning: "<red>적 부활 지점입니다! 나가세요"
