  list: "<gray>공성전 능력풀 (<white><count></white>개): <abilities>"
  list-empty: "<gray>공성전 능력풀이 비어 있어 켜진 모든 능력이 나옵니다."
  unknown-entry: "<red><id>(알 수 없음)</red>"
