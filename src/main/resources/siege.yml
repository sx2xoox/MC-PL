#  이 파일에 없는 키는 플러그인에 내장된 기본 문구를 사용합니다. 수정 후 /게임 리로드
# ─────────────────────────────────────────────────────────────

game:
  name: "<gradient:#f59e0b:#ef4444><bold>초능력 공성전</bold></gradient>"
  description:
    - "파랑 성과 빨강 성이 두 라인의 타워를 밀고 상대 코어를 부수는 팀전 (3판 2선승)."
    - "판마다 20분 점수전, 코어를 부수면 바로 승리. 초능력전쟁의 능력을 처음부터 모두 씁니다."
    - "<click:suggest_command:'/게임 공성전'><hover:show_text:'<gray>클릭하여 입력'><white>/게임 공성전</white></hover></click> <gray>능력풀 <dark_gray>·</dark_gray> <white>/게임 점수</white> <gray>· <white>/게임 리롤</white> <gray>· <white>/게임 내정보"

