# ─────────────────────────────────────────────────────────────
#  MCPL — 고전 마인크래프트 미니게임 허브 설정
#  설정을 바꾼 뒤 /게임 리로드 로 다시 불러올 수 있습니다.
#  (진행 중인 경기에는 일부 설정이 다음 경기부터 적용됩니다)
#  자주 바꾸는 설정은 게임 안에서 /게임 설정 (설정 메뉴) 이나 /게임 설정 목록 으로도
#  바꿀 수 있고, 이 파일에 바로 저장됩니다 (주석은 그대로 남습니다).
# ─────────────────────────────────────────────────────────────

# 설정 파일 버전입니다. 직접 수정하지 마세요. (업데이트 시 자동 변환에 사용)
config-version: 1

# 순환 모드: 경기가 끝나면 아래 목록의 다음 게임을 자동으로 시작합니다.
rotation:
  # /게임 순환 켜기|끄기 로도 바꿀 수 있습니다.
  enabled: false
  # 순환할 게임 id 목록 (/게임 목록 으로 확인). 위에서부터 차례로 진행합니다.
  games:
    - superpower
  # 경기와 경기 사이 대기 시간(초). 보스바로 남은 시간이 표시됩니다.
  intermission-seconds: 30

# 경기장: 모든 게임이 같은 경기장을 사용합니다.
# world 를 비워 두면 /게임 시작 을 입력한 사람의 위치가 중심이 됩니다.
# (/게임 경기장 설정 [반경] 으로 현재 위치를 저장할 수 있습니다)
arena:
  world: ''
  x: 0.0
  y: 64.0
  z: 0.0
  # 경기장 반경(블록)
  radius: 60

# 경기 진행
match:
  # 시작 전 카운트다운(초, 0~60) (/게임 설정 카운트다운 <초>)
  countdown-seconds: 5
  # 경기 종료 후 결과를 보여 준 뒤 모두를 복구하기까지의 시간(초)
  ending-seconds: 10
  # 팀당 인원. 0 = 개인전 (0~32) (/게임 설정 팀 <인원>)
  team-size: 0
  # 우승자 위치에서 축하 폭죽을 터뜨립니다.
  fireworks: true

# 월드 보호: 경기 중 경기장 월드에서 막을 행동 (true = 막기)
protection:
  # 참가자의 블록 파괴
  block-break: true
  # 참가자의 블록 설치 (양동이 사용 포함)
  block-place: true
  # 폭발로 인한 블록 파괴
  explosions: true
  # 불 붙음, 불 번짐, 블록 연소
  fire: true
  # 낙하 블록, 엔더맨 등 플레이어가 아닌 개체의 블록 변경
  entity-change-block: true
  # 그림, 아이템 액자, 갑옷 거치대 파괴·조작
  hanging: true
  # 문, 다락문, 울타리 문, 버튼, 레버, 상자, 침대 등 상호작용
  interact: true
  # 참가자의 아이템 버리기
  item-drop: true
  # 경기와 무관한 개체 보호: 주민·동물·펫 공격, 탈것·상자 보트 등 사용, 진짜 펫의 싸움 참여, 바닥 아이템 줍기
  entities: true
  # 폭발·강타 같은 능력이 지형(블록)을 부수는 곳. 부서진 블록은 경기가 끝나면 한꺼번에 원래대로 돌아옵니다.
  #   OFF        = 능력이 블록을 부수지 않음
  #   MAP_WORLDS = 내장 전투 맵 월드(mcpl_map_*)에서만 부숨 (기본값)
  #   ALL_WORLDS = 모든 경기장에서 부숨 (서버의 일반 월드 포함)
  # 땅은 원래 높이에서 최대 2칸까지만 파이고, 상자·표지판 같은 블록, 물·용암 옆, 경기장 밖은 부수지 않습니다.
  # (/게임 설정 지형파괴 끄기|맵에서만|모든월드)
  ability-block-damage: MAP_WORLDS
  # 한 경기에서 능력이 부술 수 있는 블록 수의 상한 (안전장치, 0 = 부수지 않음)
  ability-block-damage-limit: 20000

# 리소스팩: 증강 야생전의 카드 선택 화면(카드 그림, 큰 아이콘)을 그리는 서버 리소스팩입니다.
# 팩은 플러그인 안에 들어 있고, 켜면 접속하는 플레이어에게 보냅니다 (거절해도 접속은 됩니다).
# 팩을 받은 플레이어는 리소스팩 화면(games.augment.augments.ui: PACK)을, 거절했거나 받지 못한 플레이어는
# 대화창(DIALOG)을 봅니다. 자세한 방법은 docs/augment.md 의 "리소스팩" 을 보세요.
resource-pack:
  # 리소스팩 보내기 켜기/끄기
  enabled: false
  # 팩을 직접 올려 둔 주소 (예: GitHub 릴리스, 웹 호스팅의 직접 다운로드 링크).
  # plugins/MCPL/MCPL-pack.zip 을 그대로 올리세요. 비워 두면 아래 내장 웹 서버가 팩을 내려줍니다.
  url: ''
  # 내장 웹 서버 포트 (url 이 비어 있을 때). 방화벽·공유기에서 이 TCP 포트를 열어야 합니다.
  host-port: 8164
  # 플레이어가 내장 웹 서버에 접속할 주소 (도메인 또는 공인 IP, 예: mc.example.com).
  # 비워 두면 server.properties 의 server-ip 를 씁니다. 둘 다 비어 있으면 팩을 보내지 않습니다.
  public-address: ''
  # 팩 해시(SHA-1). auto = 플러그인에 든 팩의 해시. url 에 다른(수정한) 팩을 올렸다면 그 해시를 적거나 '' (검사 안 함)
  sha1: auto

# 게임별 설정. 각 게임이 처음 등록될 때 기본값을 이곳에 추가합니다.
# 예) games.superpower.* = 초능력전쟁 설정
games: {}
