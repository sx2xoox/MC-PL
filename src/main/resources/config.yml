# ─────────────────────────────────────────────────────────────
#  MCPL — 고전 마인크래프트 미니게임 허브 설정
#  설정을 바꾼 뒤 /게임 리로드 로 다시 불러올 수 있습니다.
#  (진행 중인 경기에는 일부 설정이 다음 경기부터 적용됩니다)
# ─────────────────────────────────────────────────────────────

# 설정 파일 버전입니다. 직접 수정하지 마세요. (업데이트 시 자동 변환에 사용)
config-version: 1

# 순환 모드: 경기가 끝나면 아래 목록의 다음 게임을 자동으로 시작합니다.
rotation:
  # /게임 순환 켜기|끄기 로도 바꿀 수 있습니다.
  enabled: false
  # 순환할 게임 id 목록 (/게임 목록 으로 확인). 위에서부터 차례로 진행합니다.
  games:
    - superpower
  # 경기와 경기 사이 대기 시간(초). 보스바로 남은 시간이 표시됩니다.
  intermission-seconds: 30

# 경기장: 모든 게임이 같은 경기장을 사용합니다.
# world 를 비워 두면 /게임 시작 을 입력한 사람의 위치가 중심이 됩니다.
# (/게임 경기장 설정 [반경] 으로 현재 위치를 저장할 수 있습니다)
arena:
  world: ''
  x: 0.0
  y: 64.0
  z: 0.0
  # 경기장 반경(블록)
  radius: 60

# 경기 진행
match:
  # 시작 전 카운트다운(초)
  countdown-seconds: 5
  # 경기 종료 후 결과를 보여 준 뒤 모두를 복구하기까지의 시간(초)
  ending-seconds: 10
  # 팀당 인원. 0 = 개인전 (/게임 설정 팀 <인원>)
  team-size: 0
  # 우승자 위치에서 축하 폭죽을 터뜨립니다.
  fireworks: true

# 월드 보호: 경기 중 경기장 월드에서 막을 행동 (true = 막기)
protection:
  # 참가자의 블록 파괴
  block-break: true
  # 참가자의 블록 설치 (양동이 사용 포함)
  block-place: true
  # 폭발로 인한 블록 파괴
  explosions: true
  # 불 붙음, 불 번짐, 블록 연소
  fire: true
  # 낙하 블록, 엔더맨 등 플레이어가 아닌 개체의 블록 변경
  entity-change-block: true
  # 그림, 아이템 액자, 갑옷 거치대 파괴·조작
  hanging: true
  # 문, 다락문, 울타리 문, 버튼, 레버, 상자, 침대 등 상호작용
  interact: true
  # 참가자의 아이템 버리기
  item-drop: true
  # 경기와 무관한 개체 보호: 주민·동물·펫 공격, 탈것·상자 보트 등 사용, 진짜 펫의 싸움 참여, 바닥 아이템 줍기
  entities: true

# 게임별 설정. 각 게임이 처음 등록될 때 기본값을 이곳에 추가합니다.
# 예) games.superpower.* = 초능력전쟁 설정
games: {}
